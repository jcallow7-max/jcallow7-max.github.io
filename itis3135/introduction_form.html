<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIS3135 | Jackson Calloway's Jazzy Cougar | Introduction Form</title>
    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

<div data-include="components/header.html"></div>

<main>

    <h2>Introduction Form</h2>

    <section id="form-section">
        <h3>Please submit the form below.</h3>

        <form id="intro-form">

            <fieldset>
                <legend>Name Information</legend>

                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" value="Jackson" placeholder="Enter first name" required>

                <label for="middle-name">Middle Name or Initial:</label>
                <input type="text" id="middle-name" value="S." placeholder="Enter middle name or initial">

                <label for="nickname">Nickname or Preferred Name:</label>
                <input type="text" id="nickname" value="Jazzy Cougar" placeholder="Enter nickname">

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" value="Calloway" placeholder="Enter last name" required>
            </fieldset>

            <fieldset>
                <legend>Introduction Header Details</legend>

                <label for="acknowledgment">Acknowledgment Statement:</label>
                <input type="text" id="acknowledgment" value="I understand that this page is part of my ITIS3135 coursework." placeholder="Enter acknowledgment statement" required>

               <label for="acknowledgment-date">Acknowledgment Date:</label>
<input
    type="text"
    id="acknowledgment-date"
    value="June 29, 2026"
    placeholder="Example: June 29, 2026"
    required>
                <label for="mascot-adjective">Mascot Adjective:</label>
                <input type="text" id="mascot-adjective" value="Jazzy" placeholder="Enter mascot adjective" required>

                <label for="mascot-animal">Mascot Animal:</label>
                <input type="text" id="mascot-animal" value="Cougar" placeholder="Enter mascot animal" required>

                <label for="divider">Divider:</label>
                <input type="text" id="divider" value="|" placeholder="Example: |, ~, -" required>
            </fieldset>

            <fieldset>
                <legend>Picture Information</legend>

                <label for="picture">Upload Your Own Picture:</label>
                <input type="file" id="picture" accept="image/*">

                <label for="picture-caption">Picture Caption:</label>
                <input type="text" id="picture-caption" value="This is me but I'm bald. I think it's funny." placeholder="Enter picture caption" required>
            </fieldset>

            <fieldset>
                <legend>Personal Introduction</legend>

                <label for="personal-statement">Personal Statement:</label>
                <textarea id="personal-statement" placeholder="Enter a personal statement" required>My name is Jackson Calloway, and this introduction page shares my background, interests, and goals.</textarea>

                <label for="personal-background">Personal Background:</label>
                <textarea id="personal-background" placeholder="Enter personal background" required>My name is Jackson Calloway. I am 22 years old and originally from Philadelphia, Pennsylvania, where I lived for about 16 years before moving to North Carolina. In my free time I enjoy making music, working out, coding, and keeping up with new technology. I spend a lot of time producing music using FL Studio and Logic Pro and enjoy learning new skills that challenge me both creatively and technically.</textarea>

                <label for="professional-background">Professional Background:</label>
                <textarea id="professional-background" placeholder="Enter professional background" required>I have worked at UPS and at a computer refurbishing business. Through these experiences I gained hands-on experience working with hardware, technology, teamwork, and problem solving in professional environments.</textarea>

                <label for="academic-background">Academic Background:</label>
                <textarea id="academic-background" placeholder="Enter academic background" required>I am a senior at UNC Charlotte pursuing a Bachelor of Science in Computer Science with a concentration in Information Technology.</textarea>

                <label for="subject-background">Background in this Subject:</label>
                <textarea id="subject-background" placeholder="Enter background in this subject" required>I am very new to web development. While I have programming experience using Java and Python, I have little experience with HTML, CSS, and web design.</textarea>

                <label for="platform">Primary Computer Platform:</label>
                <input type="text" id="platform" value="MacBook running macOS." placeholder="Enter computer platform" required>
            </fieldset>

            <fieldset>
                <legend>Courses</legend>

                <p>Add the courses you are taking and why you are taking them.</p>

                <div id="courses-container">
                    <div class="course-entry">
                        <label>Department:</label>
                        <input type="text" class="course-department" value="ITCS" placeholder="Example: ITCS" required>

                        <label>Course Number:</label>
                        <input type="text" class="course-number" value="3112" placeholder="Example: 3112" required>

                        <label>Course Name:</label>
                        <input type="text" class="course-name" value="Design and Implementation of Object-Oriented Systems" placeholder="Course name" required>

                        <label>Reason for Taking:</label>
                        <input type="text" class="course-reason" value="Strengthens my understanding of object-oriented programming and software design." placeholder="Reason for taking this course" required>

                        <button type="button" class="delete-course">Delete Course</button>
                    </div>

                    <div class="course-entry">
                        <label>Department:</label>
                        <input type="text" class="course-department" value="ITIS" placeholder="Example: ITIS" required>

                        <label>Course Number:</label>
                        <input type="text" class="course-number" value="3135" placeholder="Example: 3135" required>

                        <label>Course Name:</label>
                        <input type="text" class="course-name" value="Front-End Web Application Development" placeholder="Course name" required>

                        <label>Reason for Taking:</label>
                        <input type="text" class="course-reason" value="Helps me learn HTML, CSS, and web development fundamentals." placeholder="Reason for taking this course" required>

                        <button type="button" class="delete-course">Delete Course</button>
                    </div>

                    <div class="course-entry">
                        <label>Department:</label>
                        <input type="text" class="course-department" value="ITIS" placeholder="Example: ITIS" required>

                        <label>Course Number:</label>
                        <input type="text" class="course-number" value="3200" placeholder="Example: 3200" required>

                        <label>Course Name:</label>
                        <input type="text" class="course-name" value="Introduction to Information Security and Privacy" placeholder="Course name" required>

                        <label>Reason for Taking:</label>
                        <input type="text" class="course-reason" value="Teaches information security concepts and how systems and data are protected." placeholder="Reason for taking this course" required>

                        <button type="button" class="delete-course">Delete Course</button>
                    </div>

                    <div class="course-entry">
                        <label>Department:</label>
                        <input type="text" class="course-department" value="ITIS" placeholder="Example: ITIS" required>

                        <label>Course Number:</label>
                        <input type="text" class="course-number" value="4350" placeholder="Example: 4350" required>

                        <label>Course Name:</label>
                        <input type="text" class="course-name" value="Design Prototyping" placeholder="Course name" required>

                        <label>Reason for Taking:</label>
                        <input type="text" class="course-reason" value="Focuses on design concepts, prototyping, and user experience." placeholder="Reason for taking this course" required>

                        <button type="button" class="delete-course">Delete Course</button>
                    </div>
                </div>

                <button type="button" id="add-course">Add Course</button>
            </fieldset>

            <fieldset>
                <legend>Quote and Extras</legend>

                <label for="quote">Quote:</label>
                <input type="text" id="quote" value="Everything negative – pressure, challenges – is all an opportunity for me to rise." placeholder="Enter quote" required>

                <label for="quote-author">Quote Author:</label>
                <input type="text" id="quote-author" value="Kobe Bryant" placeholder="Enter quote author" required>

                <label for="funny-thing">Funny Thing:</label>
                <input type="text" id="funny-thing" value="There was a period of time when I was completely bald. At one point I joked that I should flip a coin every day to decide whether I would shave my head again or try growing my hair back. Fortunately for me, the coin eventually lost its authority." placeholder="Optional funny thing">

                <label for="share">Something I Would Like to Share:</label>
                <input type="text" id="share" value="I enjoy combining technology and creativity through both programming and music production. After graduation, I hope to build a career in technology while continuing to develop my skills in software, IT, and creative projects." placeholder="Optional thing to share">
            </fieldset>

            <fieldset>
                <legend>Links</legend>

                <label for="link-one-name">Link 1 Name:</label>
                <input type="text" id="link-one-name" value="LinkedIn" placeholder="Example: LinkedIn">

                <label for="link-one-url">Link 1 URL:</label>
                <input type="url" id="link-one-url" value="https://www.linkedin.com/in/jackson-calloway-03691b413" placeholder="https://www.linkedin.com">

                <label for="link-two-name">Link 2 Name:</label>
                <input type="text" id="link-two-name" value="GitHub" placeholder="Example: GitHub">

                <label for="link-two-url">Link 2 URL:</label>
                <input type="url" id="link-two-url" value="https://github.com/jcallow7-max" placeholder="https://github.com">

                <label for="link-three-name">Link 3 Name:</label>
                <input type="text" id="link-three-name" value="GitHub.io" placeholder="Example: GitHub.io">

                <label for="link-three-url">Link 3 URL:</label>
                <input type="url" id="link-three-url" value="https://jcallow7-max.github.io" placeholder="https://github.io">

                <label for="link-four-name">Link 4 Name:</label>
                <input type="text" id="link-four-name" value="freeCodeCamp" placeholder="Example: freeCodeCamp">

                <label for="link-four-url">Link 4 URL:</label>
                <input type="url" id="link-four-url" value="https://www.freecodecamp.org/blackson" placeholder="https://www.freecodecamp.org">

                <label for="link-five-name">Link 5 Name:</label>
                <input type="text" id="link-five-name" value="Codecademy" placeholder="Example: Codecademy">

                <label for="link-five-url">Link 5 URL:</label>
                <input type="url" id="link-five-url" value="https://www.codecademy.com/profiles/bbblackson" placeholder="https://www.codecademy.com">
            </fieldset>

            <div class="form-buttons">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
                <button type="button" id="clear-form">Clear</button>
            </div>

        </form>
    </section>

    <div id="result-section"></div>

</main>

<div data-include="components/footer.html"></div>

<script src="scripts/HTMLInclude.min.js"></script>
<script src="scripts/introduction.js"></script>

</body>

</html>
